<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <title>Pinball</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; overscroll-behavior: none; }
      body {
        background: #0b0b1a; color: #ddd; font-family: monospace;
        display: flex; flex-direction: column; align-items: center;
        touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
        -webkit-tap-highlight-color: transparent;
      }
      canvas {
        width: min(100vw, calc(92vh * 0.75));
        width: min(100vw, calc(92dvh * 0.75));
        aspect-ratio: 3 / 4; height: auto; margin-top: 8px; touch-action: none;
      }
      p { margin: 6px; font-size: 13px; text-align: center; }
      .touch-hint { display: none; }
      @media (pointer: coarse) {
        .key-hint { display: none; }
        .touch-hint { display: block; }
      }
    </style>
  </head>
  <body>
    <canvas id="table" width="600" height="800"></canvas>
    <p class="key-hint">Z / ← left flipper &nbsp; / / → right flipper &nbsp; hold Space to charge plunger, release to launch &nbsp; A / D / W nudge (too much = TILT) &nbsp; M music &nbsp; N sound &nbsp; Esc table menu</p>
    <p class="touch-hint">Hold left or right side to flip &nbsp; slowly drag down to pull the plunger &nbsp; swipe fast to nudge (too much = TILT)</p>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
